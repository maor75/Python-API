apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secret-validator-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # For cloud providers, uncomment appropriate annotations:
    # GKE:
    # kubernetes.io/ingress.class: "gce"
    # AWS:
    # kubernetes.io/ingress.class: "alb"
    # Azure:
    # kubernetes.io/ingress.class: "azure/application-gateway"
spec:
  ingressClassName: nginx
  rules:
  - host: secret-validator.example.com  # Replace with your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: secret-validator-service
            port:
              number: 80
